# Arbitre de l'atelier CUPID : à chaque PR, le harnais tourne sur la base, sur le baby step précédent de l'équipe et
# sur la tête ; l'arbitre compare les rapports JSON, commente la PR (verdict, score, niveau, badges), recalcule le
# classement et fait échouer le check si la PR n'est pas un baby step (règle cible pas verte, régression, harness/
# modifié, projet qui ne compile pas).
#
# Rien n'est jamais fusionné : chaque PR est un draft qui vise la branche de la phase, et les branches d'une équipe
# s'enchaînent (team-red/step-1/ha9 part de team-red/step-1/ha8). Le score du round est le delta avec le step
# précédent, retrouvé automatiquement ; le chemin parcouru depuis la phase est affiché sans points.
#
# Mesures du score : les tokens (coût de lecture et d'écriture pour un agent) remplacent les lignes ; la complexité
# cyclomatique vient de PMD (règle CyclomaticComplexity). Les deux sont dans les rapports JSON du harnais.
#
# Les PR doivent être internes au dépôt (une équipe = un préfixe de branche, team-red/step-1/ha9-...) : depuis un
# fork, le jeton est en lecture seule et le commentaire est impossible. On n'utilise pas pull_request_target, qui
# exécuterait le code des étudiants avec des droits en écriture.
name: harness-game

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: harness-game-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  referee:
    name: Arbitre CUPID (harnais sur la base et sur la PR)
    runs-on: ubuntu-latest
    env:
      # La base vient du commit de fusion de la PR (GITHUB_SHA), voir l'étape « Base of the PR ».
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      # Petit diff : tokens ajoutés ou retirés dans src/main/java (tests et Markdown exclus).
      SMALL_DIFF_TOKENS: "400"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # gradle-wrapper.jar n'est pas versionné : harness.sh utilise alors le Gradle installé.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # La base est le premier parent du commit de fusion (refs/pull/N/merge) : c'est de lui que vient ce workflow.
      # github.event.pull_request.base.sha peut être en retard sur la branche de la phase : le workflow récent
      # appelait alors un arbitre ancien, qui ne connaissait pas ses options.
      - name: Base of the PR
        run: |
          git fetch -q origin "$GITHUB_SHA"
          echo "BASE_SHA=$(git rev-parse "$GITHUB_SHA^1")" >> "$GITHUB_ENV"
          echo "Base : $(git rev-parse "$GITHUB_SHA^1") (événement : ${{ github.event.pull_request.base.sha }})"

      # L'arbitre et le harnais de la base font foi : le code de la PR ne juge pas la PR.
      # Une base sans harnais (par exemple main) ne peut pas arbitrer : la PR doit viser la branche de la phase
      # (java-bdxio-phase1, java-bdxio-phase2) ou la branche du baby step précédent.
      - name: Harness on the base
        id: base
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          if [ ! -x "$RUNNER_TEMP/base/harness.sh" ]; then
            echo "playable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          (cd "$RUNNER_TEMP/base" && ./harness.sh all --json "$RUNNER_TEMP/base.json") || true
          if ls "$RUNNER_TEMP"/base/harness/build/install/harness/lib/*.jar > /dev/null 2>&1 \
              && java -cp "$RUNNER_TEMP/base/harness/build/install/harness/lib/*" com.omniproduct.harness.Tokens --diff /dev/null > /dev/null 2>&1; then
            echo "playable=true" >> "$GITHUB_OUTPUT"
          else
            echo "playable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Base sans arbitre
        if: steps.base.outputs.playable != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          {
            echo "## 🎮 Arbitre CUPID : hors jeu"
            echo
            echo "La branche de base \`$BASE_REF\` n'a pas d'arbitre : cette PR ne peut pas être notée."
            echo "Changez la base de la PR (bouton **Edit** à côté du titre) pour la branche de votre phase"
            echo "(\`java-bdxio-phase1\` ou \`java-bdxio-phase2\`), ou pour la branche de votre baby step précédent."
          } > "$RUNNER_TEMP/scorecard.md"

      # Le step précédent : parmi les branches de la même équipe (premier segment du nom), la plus avancée dont la PR
      # descend, au point où elle en est partie (merge-base). Aucune : c'est le premier step, comparé à la phase.
      - name: Previous step of the team
        id: previous
        if: steps.base.outputs.playable == 'true'
        run: |
          team=${PR_BRANCH%%/*}
          fork=$(git merge-base "$HEAD_SHA" "$BASE_SHA")
          best_sha=$fork best_ref="" best_n=0
          while read -r ref; do
            [ "$ref" = "origin/$PR_BRANCH" ] && continue
            mb=$(git merge-base "$HEAD_SHA" "$ref") || continue
            [ "$mb" = "$HEAD_SHA" ] && continue
            git merge-base --is-ancestor "$fork" "$mb" || continue
            n=$(git rev-list --count "$fork..$mb")
            if [ "$n" -gt "$best_n" ]; then best_sha=$mb best_ref=${ref#origin/} best_n=$n; fi
          done < <(git for-each-ref --format='%(refname:short)' "refs/remotes/origin/$team/")
          echo "sha=$best_sha" >> "$GITHUB_OUTPUT"
          echo "ref=$best_ref" >> "$GITHUB_OUTPUT"
          echo "Step précédent : ${best_ref:-aucun (premier step)} @ $best_sha"

      - name: Harness on the previous step
        if: steps.base.outputs.playable == 'true' && steps.previous.outputs.ref != ''
        env:
          PREV_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/previous" "$PREV_SHA"
          (cd "$RUNNER_TEMP/previous" && ./harness.sh all --json "$RUNNER_TEMP/previous.json") || true

      - name: Harness on the pull request
        if: steps.base.outputs.playable == 'true'
        run: ./harness.sh all --json "$RUNNER_TEMP/head.json" || true

      # harness/ est vérifié depuis la phase (toute la chaîne) ; le petit diff ne compte que le round.
      - name: Changed files and tokens
        if: steps.base.outputs.playable == 'true'
        env:
          PREV_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          git diff -U0 "$PREV_SHA" "$HEAD_SHA" -- src/main/java > "$RUNNER_TEMP/changes.diff"
          java -cp "$RUNNER_TEMP/base/harness/build/install/harness/lib/*" com.omniproduct.harness.Tokens \
            --diff "$RUNNER_TEMP/changes.diff" > "$RUNNER_TEMP/changed-tokens.txt"

      - name: Arbitre
        id: referee
        if: steps.base.outputs.playable == 'true'
        env:
          PREV_SHA: ${{ steps.previous.outputs.sha }}
          PREV_REF: ${{ steps.previous.outputs.ref }}
        run: |
          set +e
          if [ -n "$PREV_REF" ]; then
            round=(--base "$RUNNER_TEMP/previous.json" --phase "$RUNNER_TEMP/base.json" --previous "\`$PREV_REF\` (${PREV_SHA:0:7})")
          else
            round=(--base "$RUNNER_TEMP/base.json")
          fi
          java -cp "$RUNNER_TEMP/base/harness/build/install/harness/lib/*" com.omniproduct.harness.referee.RefereeMain \
            "${round[@]}" --head "$RUNNER_TEMP/head.json" \
            --title "$PR_TITLE" --branch "$PR_BRANCH" \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --changed-tokens "$(cat "$RUNNER_TEMP/changed-tokens.txt")" \
            --small-diff "$SMALL_DIFF_TOKENS" \
            --out "$RUNNER_TEMP/scorecard.md"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      # Un nouveau commentaire à chaque round, sous le dernier push : modifier l'ancien le laissait plus haut dans le
      # fil, au-dessus des nouveaux commits, et le nouveau score passait inaperçu. Les commentaires précédents de
      # l'arbitre sont masqués (« outdated ») mais restent consultables ; le classement lit le dernier.
      - name: Comment the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$RUNNER_TEMP/scorecard.md" ]; then
            printf '%s\n\n%s\n' "## 🎮 Arbitre CUPID : en panne" \
              "L'arbitre n'a pas pu écrire son verdict : voir l'onglet **Checks** de la PR, et prévenir l'animateur." \
              > "$RUNNER_TEMP/scorecard.md"
          fi
          url=$(gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/scorecard.md")
          echo "$url"
          new_id=${url##*#issuecomment-}
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and .id != $new_id
                         and (.body | contains(\"<!-- harness-referee \") or startswith(\"## 🎮 Arbitre CUPID\"))) | .node_id" \
            | while read -r node; do
                gh api graphql -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId } }' \
                  -f id="$node" > /dev/null || echo "::warning::commentaire $node non masqué"
              done

      # Le score du round en tête de la PR : une section délimitée de la description, réécrite à chaque passage.
      # Construite à partir du marqueur JSON du commentaire, pour ne dépendre d'aucune option de l'arbitre de la base.
      # Une modification faite avec le jeton de l'Action ne relance pas l'Action (pas de boucle sur « edited »).
      - name: Score in the PR description
        if: steps.referee.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker=$(grep -o '<!-- harness-referee .* -->' "$RUNNER_TEMP/scorecard.md" | tail -1)
          json=${marker#<!-- harness-referee }
          json=${json% -->}
          echo "$json" | jq -r --arg pr "$PR_NUMBER" '
            (if .outcome == "ACCEPTED" then "✅ accepté" elif .outcome == "REJECTED" then "❌ refusé" else "⚪ hors jeu" end) as $verdict
            | "<!-- arbitre-cupid:start -->",
              "### 🎮 Arbitre CUPID" + (if .target == "" then "" else " — " + .target end) + " : " + $verdict
                + (if .outcome == "OFF_GAME" then "" else " · **" + (if .score > 0 then "+" else "" end) + (.score | tostring) + "**" end),
              "",
              "Niveau : " + .level,
              "",
              (if (.badges | length) > 0
                then (.badges | map("![" + . + "](https://img.shields.io/badge/" + (gsub("-"; "--") | gsub("_"; "__") | @uri)
                    + "-" + ({"🍼 Baby step": "2ea44f", "🧼 No regression": "1f6feb", "🤏 Small diff": "8250df",
                             "👑 Boss defeated": "d4a017", "🧠 Compiler-checked": "e36209"}[.] // "555555")
                    + "?style=for-the-badge)") | join(" ")) + "\n"
                else empty end),
              "_Mis à jour par l’arbitre à chaque push ; le détail est dans son commentaire._",
              "<!-- arbitre-cupid:end -->"' > "$RUNNER_TEMP/section.md"
          gh pr view "$PR_NUMBER" --json body --jq .body > "$RUNNER_TEMP/body.md"
          python3 - "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/section.md" "$RUNNER_TEMP/new-body.md" <<'EOF'
          import re, sys
          body, section = open(sys.argv[1]).read().rstrip("\n"), open(sys.argv[2]).read().strip("\n")
          pattern = re.compile(r"<!-- arbitre-cupid:start -->.*?<!-- arbitre-cupid:end -->", re.S)
          new = pattern.sub(lambda _: section, body) if pattern.search(body) else section + ("\n\n" + body if body else "")
          open(sys.argv[3], "w").write(new + "\n")
          EOF
          if ! diff -q <(sed -e '$a\' "$RUNNER_TEMP/body.md") "$RUNNER_TEMP/new-body.md" > /dev/null; then
            gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/new-body.md"
          fi

      # Le classement de la phase : la somme, par équipe, du dernier score de chaque PR ouverte vers cette base.
      - name: Leaderboard
        if: steps.referee.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          title="CUPID workshop leaderboard ($BASE_REF)"
          gh pr list --state open --base "$BASE_REF" --limit 1000 --json number,headRefName,comments > "$RUNNER_TEMP/prs.json"
          java -cp "$RUNNER_TEMP/base/harness/build/install/harness/lib/*" com.omniproduct.harness.referee.Leaderboard \
            --prs "$RUNNER_TEMP/prs.json" --out "$RUNNER_TEMP/leaderboard.md"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -z "$number" ]; then
            url=$(gh issue create --title "$title" --body-file "$RUNNER_TEMP/leaderboard.md")
            gh issue pin "$url" || true
          else
            gh issue edit "$number" --body-file "$RUNNER_TEMP/leaderboard.md"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-reports-pr-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/base.json
            ${{ runner.temp }}/previous.json
            ${{ runner.temp }}/head.json
            ${{ runner.temp }}/scorecard.md
          if-no-files-found: warn

      - name: Verdict
        run: |
          cat "$RUNNER_TEMP/scorecard.md" >> "$GITHUB_STEP_SUMMARY"
          test "${{ steps.referee.outputs.exit }}" = "0"
