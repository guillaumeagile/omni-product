<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

    <title>CUTE DDD hands-on — atelier 2 h</title>

    <link href="dist/reset.css" rel="stylesheet">
    <link href="dist/reveal.css" rel="stylesheet">
    <link href="dist/theme/dracula.css" rel="stylesheet">

    <!-- Theme used for syntax highlighted code -->
    <link href="plugin/highlight/monokai.css" rel="stylesheet">
</head>
<body>
<div class="reveal">
    <div class="slides">
        <section
                data-markdown="markdown/00-intro.md"
                data-separator="^\n---\n$"
                data-separator-notes="^Note:"
                data-separator-vertical="^\n--\n$"
                data-transition="concave"
        >
        </section>
        <section
                data-markdown="markdown/10-4c.md"
                data-separator="^\n---\n$"
                data-separator-notes="^Note:"
                data-separator-vertical="^\n--\n$"
                data-transition="concave"
        >
        </section>
        <section
                data-markdown="markdown/20-connections.md"
                data-separator="^\n---\n$"
                data-separator-notes="^Note:"
                data-separator-vertical="^\n--\n$"
                data-transition="convex"
        >
        </section>
        <section
                data-markdown="markdown/30-concepts.md"
                data-separator="^\n---\n$"
                data-separator-notes="^Note:"
                data-separator-vertical="^\n--\n$"
                data-transition="convex"
        >
        </section>
        <section
                data-markdown="markdown/40-practice.md"
                data-separator="^\n---\n$"
                data-separator-notes="^Note:"
                data-separator-vertical="^\n--\n$"
                data-transition="concave"
        >
        </section>
        <section
                data-markdown="markdown/50-conclusions.md"
                data-separator="^\n---\n$"
                data-separator-notes="^Note:"
                data-separator-vertical="^\n--\n$"
                data-transition="convex"
        >
        </section>
        <section
                data-markdown="markdown/90-closing.md"
                data-separator="^\n---\n$"
                data-separator-notes="^Note:"
                data-separator-vertical="^\n--\n$"
                data-transition="concave"
        >
        </section>
    </div>
</div>

<script src="dist/reveal.js"></script>
<script src="plugin/notes/notes.js"></script>
<script src="plugin/markdown/markdown.js"></script>
<script src="plugin/highlight/highlight.js"></script>
<script>
    Reveal.initialize({
        hash: true,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
    });
</script>
</body>
</html>
