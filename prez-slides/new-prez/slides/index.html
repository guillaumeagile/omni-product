<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>CUTE DDD hands-on — atelier 2 h</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/dracula.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section
					data-markdown="markdown/00-intro.md"
					data-separator="^\n---\n$"
					data-separator-vertical="^\n--\n$"
					data-separator-notes="^Note:"
					data-transition="concave"
					>
				</section>
				<section
					data-markdown="markdown/10-4c.md"
					data-separator="^\n---\n$"
					data-separator-vertical="^\n--\n$"
					data-separator-notes="^Note:"
					data-transition="concave"
					>
				</section>
				<section
					data-markdown="markdown/20-connections.md"
					data-separator="^\n---\n$"
					data-separator-vertical="^\n--\n$"
					data-separator-notes="^Note:"
					data-transition="convex"
					>
				</section>
				<section
					data-markdown="markdown/30-concepts.md"
					data-separator="^\n---\n$"
					data-separator-vertical="^\n--\n$"
					data-separator-notes="^Note:"
					data-transition="convex"
					>
				</section>
				<section
					data-markdown="markdown/40-practice.md"
					data-separator="^\n---\n$"
					data-separator-vertical="^\n--\n$"
					data-separator-notes="^Note:"
					data-transition="concave"
					>
				</section>
				<section
					data-markdown="markdown/50-conclusions.md"
					data-separator="^\n---\n$"
					data-separator-vertical="^\n--\n$"
					data-separator-notes="^Note:"
					data-transition="convex"
					>
				</section>
				<section
					data-markdown="markdown/90-closing.md"
					data-separator="^\n---\n$"
					data-separator-vertical="^\n--\n$"
					data-separator-notes="^Note:"
					data-transition="concave"
					>
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script>
			Reveal.initialize({
				hash: true,
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
			});
		</script>
	</body>
</html>
